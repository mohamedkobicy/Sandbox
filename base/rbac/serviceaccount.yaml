# Rendered per-request by scripts/provision.sh via envsubst.
# Required vars: SANDBOX_NAMESPACE, SERVICE_ACCOUNT_NAME, CATALOG_ID, REQUEST_ID
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${SERVICE_ACCOUNT_NAME}
  namespace: ${SANDBOX_NAMESPACE}
  labels:
    sandbox.gosi/catalog-id: "${CATALOG_ID}"
    sandbox.gosi/request-id: "${REQUEST_ID}"
    sandbox.gosi/managed-by: "sandbox-automation"
# Workload pods reference this SA explicitly and disable automatic API token
# mounting at the pod spec level (automountServiceAccountToken: false) unless
# a specific catalog entry genuinely needs API access (e.g. OPS-OC).
automountServiceAccountToken: false
