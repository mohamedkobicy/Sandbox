# Strategic-merge patch applied with `oc patch deployment/${WORKLOAD_NAME}`
# by scripts/provision.sh, ONLY when --enable secrets --secret-ref <name> is
# supplied AND that Secret already exists in ${SANDBOX_NAMESPACE}
# (provision.sh validates existence first and fails closed otherwise).
#
# Required vars: WORKLOAD_NAME, SECRET_REF_NAME
#
# This patch never contains, generates, or reveals secret material -- only
# a reference by name (Governance: "No embedded credentials").
spec:
  template:
    spec:
      containers:
        - name: workspace
          volumeMounts:
            - name: injected-secret
              mountPath: /var/run/secrets/sandbox/${SECRET_REF_NAME}
              readOnly: true
      volumes:
        - name: injected-secret
          secret:
            secretName: ${SECRET_REF_NAME}
            defaultMode: 0440
