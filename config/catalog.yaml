---
# =============================================================================
# config/catalog.yaml -- Enterprise Sandbox Catalog (machine-readable source)
# =============================================================================
#
# This file is the SINGLE SOURCE OF TRUTH for what can be provisioned through
# the sandbox automation. It is generated from, and must be kept in sync with,
# the "Catalog" sheet of Sandbox_Image_Catalog.xlsx (see docs/CATALOG-MAPPING.md
# for the full Catalog ID -> implementation mapping and the reconciliation
# report at the bottom of that document).
#
# Consumers: scripts/provision.sh, scripts/validate.sh, scripts/health-check.sh,
# and (in the future) any HTTP provisioning API, Ansible playbooks, or the
# Remedy integration layer. Do NOT hardcode catalog knowledge (image names,
# profiles, approval rules) anywhere else -- read it from this file.
#
# Schema notes (per entry, keyed by Catalog ID):
#   type                : workspace | service | platform-service | integration | base-image
#   implementation.method:
#     none-base-image      - build-time base layer only; not independently provisioned
#     workspace-template   - rendered from templates/workspace/base
#     service-template     - rendered from templates/service/base
#     statefulset-template - rendered from templates/platform-service/base/statefulset
#                            (direct approved image, no operator dependency)
#     operator-placeholder - IMPLEMENTATION_REQUIRED: needs an enterprise-selected
#                            operator (see implementation.candidateOperators /
#                            decisionNeeded). See templates/platform-service/base/operator-placeholder.
#     helm-placeholder     - IMPLEMENTATION_REQUIRED: needs an enterprise-selected
#                            and security-reviewed Helm chart (see implementation.candidateCharts).
#     platform-integration - not a standalone workload; a configuration/component
#                            layered onto other workspaces (see templates/integration/*).
#   image.repository     : relative to registry.organization in config/registry.yaml
#                           (null when delivery is via operator/template, not a direct image)
#   image.tag             : "approved" today; production should migrate to image.digest
#                           (see config/registry.yaml and docs/ARCHITECTURE.md "Image Supply Chain")
#   profile               : key into config/profiles.yaml (small|medium|large) -- resource
#                           values are NEVER duplicated here, only referenced by name
#   storage.enabled/size  : drives whether scripts/provision.sh creates a PVC
#   gpu.supported         : whether --gpu true is allowed for this Catalog ID at all
#                           (GPU is never auto-requested -- see config/policies.yaml)
#   approval              : auto | review (see config/policies.yaml "approval" section)
#   remedySelectable      : whether this Catalog ID is exposed as a Remedy service
#                           catalog item (mirrors the "Remedy Catalog View" sheet)
#
apiVersion: sandbox.gosi/v1
